<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f141b" />
    <title>Shardfall</title>
    <script type="module" crossorigin src="/assets/index-uzDK5S96.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BbgQqne8.css">
  </head>
  <body>
    <canvas id="map"></canvas>

    <div id="conn-status" class="hidden">Reconnecting&hellip;</div>
    <div id="toasts"></div>

    <div id="hud" class="hidden">
      <div id="topbar">
        <span id="tb-shard" class="tb-chip"></span>
        <span id="tb-name" class="tb-chip"></span>
        <span id="tb-coords" class="tb-chip"></span>
        <span id="tb-teleports" class="tb-chip"></span>
        <span id="tb-marches" class="tb-chip"></span>
        <span id="tb-shield" class="tb-chip shield hidden"></span>
        <span class="tb-spacer"></span>
        <button id="btn-home" class="tb-btn" title="Center on your keep">Home</button>
        <button id="btn-randtp" class="tb-btn">Random TP</button>
        <button id="btn-quests" class="tb-btn">Quests<span id="quest-badge" class="badge gold hidden"></span></button>
        <button id="btn-reports" class="tb-btn">Reports<span id="report-badge" class="badge hidden"></span></button>
        <button id="btn-alliance" class="tb-btn">Alliance</button>
      </div>
      <div id="resource-bar"></div>
    </div>

    <div id="tile-panel" class="sheet hidden"></div>
    <div id="base-panel" class="sheet hidden"></div>
    <div id="alliance-panel" class="sheet hidden"></div>
    <div id="reports-panel" class="sheet hidden"></div>
    <div id="quests-panel" class="sheet hidden"></div>

    <div id="report-modal" class="modal hidden"></div>
    <div id="march-modal" class="modal hidden"></div>

    <div id="chat-panel" class="collapsed">
      <div id="chat-header">Chat</div>
      <div id="chat-body">
        <div id="chat-tabs">
          <button id="chat-tab-world" class="chat-tab active">World</button>
          <button id="chat-tab-alliance" class="chat-tab">Alliance</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input id="chat-input" type="text" maxlength="280" placeholder="Message&hellip;" />
          <button id="chat-send">Send</button>
        </div>
      </div>
    </div>

    <div id="login-screen">
      <div id="login-card">
        <h1 id="login-title">SHARDFALL</h1>
        <p id="login-sub">A Medieval Fantasy Strategy Realm</p>
        <p id="login-flavor">
          Raise your keep from the wilds, muster spears and banners, and carve
          your name across the shard before rival lords carve yours away.
        </p>
        <form id="login-form">
          <input
            id="login-name"
            type="text"
            maxlength="24"
            autocomplete="off"
            placeholder="Name your lord…"
          />
          <button id="login-btn" type="submit">Enter the Realm</button>
        </form>
        <p id="login-status"></p>
      </div>
    </div>

  </body>
</html>
